</head><body><div class="loading" style="opacity: 0;"><div class="loadingBar left"></div><div class="loadingBar right"></div></div><main><header class="closed"><div class="navBtn"><i class="navBtnIcon"><span class="navBtnIconBar"></span><span class="navBtnIconBar"></span><span class="navBtnIconBar"></span></i></div><nav><div class="navItem" id="search-header"><span class="navItemTitle"><input autocomplete="off" autocorrect="off" autocapitalize="none" placeholder="Search" spellcheck="false" maxlength="50" type="text" id="search-input"></span></div><div class="navItem" id="search-holder"></div><div class="search-popup" tabindex="0"><div id="search-result"></div></div><ol class="navContent"><li class="navItem"><a class="navBlock" href="/"><span class="navItemTitle">HOME</span></a></li><li class="navItem"><a class="navBlock" href="/projects/"><span class="navItemTitle">Projects</span></a></li><li class="navItem" matchdata="categories,tags"><a class="navBlock" href="/archives/"><span class="navItemTitle">Articles</span></a></li><li class="navItem"><a class="navBlock" href="/tags/"><span class="navItemTitle">Tags</span></a></li></ol></nav></header><article><div class="posts"><a class="recent-post" href="/articles/brushed-dc-motor-sensorless-speed/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%94%B5%E6%9C%BA%E6%8E%A7%E5%88%B6/">电机控制</a></object></span><span class="tags"><object><a href="/tags/%E6%9C%89%E5%88%B7%E7%94%B5%E6%9C%BA/">有刷电机</a></object><object><a href="/tags/%E6%97%A0%E6%84%9F/">无感</a></object><object><a href="/tags/%E7%BA%B9%E6%B3%A2%E8%AE%A1%E6%95%B0/">纹波计数</a></object></span><time datetime="2026-04-08T12:00:00.000Z">2026-04-08</time></div><h1 class="recent-title">有刷电机的无感驱动：基于换相纹波与电压尖峰的测速思路</h1><div class="recent-excerpt"><hr><p>有刷直流电机通常被认为是最容易驱动的一类电机：只要给电机两端施加直流电压，电刷和换向器就会自动完成绕组换相，控制器只需要负责 PWM、方向和电流限制即可。但如果希望进一步实现闭环调速、堵转判断、行程控制或者位置估计，问题就会变成：在不增加霍尔传感器、光电编码器或磁编码器的情况下，能不能从电机本身的电气信号中推断出转速和位置？</p>
<p>这个问题就是本文想讨论的“有刷电机无感驱动”。这里的“无感”不是指完全不测量任何信号，而是指不额外安装专门的转子位置传感器。控制器仍然需要观察电机电流、电压或由这些信号经过滤波得到的脉冲，才能建立速度和位置反馈。</p>
<p>本文的思路来自对有刷和无刷电机控制方式的对比，也参考了 TI 关于有刷直流电机纹波计数的应用报告、DRV8214&#x2F;DRV8234 数据手册和应用简报。文章中的图片来自 TI 公开文档，主要用来说明换向器、电流纹波和 RC_OUT 脉冲之间的关系；真正复刻时仍然需要根据电机型号、负载和供电条件重新测试。</p></div><span class="read-more">阅读文章 +</span></object></a></div><div class="bottom-btn"><div><a class="i-top" id="to-top" onClick="scrolls.scrolltop();" title="回到顶部" style="opacity: 0; display: none;">∧ </a><a class="i-color" id="color-mode" onClick="colorMode.change()" title="切换主题"></a></div></div></article><aside><div id="about"><a href="/" id="logo"><img src="https://ak.hypergryph.com/assets/index/images/ak/pc/faction/1.png" alt="Logo"></a><h1 id="Dr"><a href="/">Direject</a></h1><div id="description"><p>个人作品集：嵌入式固件、硬件电路、视觉工具链与工程笔记。</p></div><div id="social-links"><a class="social" target="_blank" rel="noopener" href="https://oshwhub.com/pessenger?tab=works&amp;jspm=hub.ss.zp&amp;jlc_vid=RVdaAlNeQlNbAQdfRgdbBlBTTgBWVQBSRFZbV1UFEwMxVlNeTlVWUVZRQFZXVTsOAxUeFF5JWA8aF0oLBA9ABApJKA0NAgAHWQIA"><i class="fa fa-microchip" alt="立创开源"></i></a><a class="social" href="mailto:3505337350@qq.com"><i class="fa fa-envelope" alt="E-Mail"></i></a><a class="social" target="_blank" rel="noopener" href="https://space.bilibili.com/3546391322298955?spm_id_from=333.1007.0.0"><i class="fa-brands fa-bilibili" alt="BiliBili"></i></a></div></div><div id="aside-block"><section id="total"><a id="total-archives" href="/archives"><span class="total-title">Articles Total:</span><span class="total-number">11</span></a><div id="total-tags"><span class="total-title">Tags:</span><span class="total-number">17</span></div><div id="total-categories"><span class="total-title">Categories:</span><span class="total-number">3</span></div></section></div><footer><nobr>构建自 <a target="_blank" rel="noopener" href="http://hexo.io">Hexo</a></nobr></footer></aside></main><canvas id="canvas-dust"></canvas></body></html>

</head><body><div class="loading" style="opacity: 0;"><div class="loadingBar left"></div><div class="loadingBar right"></div></div><main><header class="closed"><div class="navBtn"><i class="navBtnIcon"><span class="navBtnIconBar"></span><span class="navBtnIconBar"></span><span class="navBtnIconBar"></span></i></div><nav><div class="navItem" id="search-header"><span class="navItemTitle"><input autocomplete="off" autocorrect="off" autocapitalize="none" placeholder="Search" spellcheck="false" maxlength="50" type="text" id="search-input"></span></div><div class="navItem" id="search-holder"></div><div class="search-popup" tabindex="0"><div id="search-result"></div></div><ol class="navContent"><li class="navItem"><a class="navBlock" href="/"><span class="navItemTitle">HOME</span></a></li><li class="navItem"><a class="navBlock" href="/projects/"><span class="navItemTitle">Projects</span></a></li><li class="navItem" matchdata="categories,tags"><a class="navBlock" href="/archives/"><span class="navItemTitle">Articles</span></a></li><li class="navItem"><a class="navBlock" href="/tags/"><span class="navItemTitle">Tags</span></a></li></ol></nav></header><article><div class="posts"><a class="recent-post" href="/projects/3-6s-smart-power-distribution-board/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/%E5%88%86%E7%94%B5%E6%9D%BF/">分电板</a></object><object><a href="/tags/BEC/">BEC</a></object><object><a href="/tags/CH32V203/">CH32V203</a></object><object><a href="/tags/CAN/">CAN</a></object><object><a href="/tags/%E7%94%B5%E6%BA%90%E7%AE%A1%E7%90%86/">电源管理</a></object><object><a href="/tags/%E6%97%A0%E4%BA%BA%E6%9C%BA/">无人机</a></object><object><a href="/tags/%E5%9B%BA%E5%AE%9A%E7%BF%BC/">固定翼</a></object></span><time datetime="2026-09-18T12:00:00.000Z">2026-09-18</time></div><h1 class="recent-title">3-6S 双路 BEC 智能分电板设计</h1><div class="recent-excerpt"><hr><p>这是一块面向 3-6S 动力系统设计的智能分电板。它在完成基础电源分配的同时，把双路 BEC、母线电流与电压检测、温度采集、CAN 通信和状态指示集成到一块 47 mm × 46 mm 的六层 PCB 上。</p>
<p>目前这块板已经完成上机测试，并分别在四旋翼平台和固定翼平台上完成飞行验证。40 A 负载测试下，板上温度约为 40 °C，满足当前平台对体积、供电能力和遥测功能的要求。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/articles/axdr-l-brushless-driver-summary/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%B7%A5%E7%A8%8B%E5%A4%8D%E7%9B%98/">工程复盘</a></object></span><span class="tags"><object><a href="/tags/FOC/">FOC</a></object><object><a href="/tags/STM32G474/">STM32G474</a></object><object><a href="/tags/%E7%94%B5%E6%9C%BA%E6%8E%A7%E5%88%B6/">电机控制</a></object></span><time datetime="2026-09-17T12:30:00.000Z">2026-09-17</time></div><h1 class="recent-title">AXDR-L 无刷驱动程序阶段总结</h1><div class="recent-excerpt"><hr><p>这篇文章单独复盘 AXDR_L 无刷驱动程序，而不是再从头讲一遍 FOC 理论。当前工程源地址是 <code>C:\Users\35053\Desktop\Class\控制设计\AxDr_L\3.AXDR_X7_Speedloop</code>。它的目标很明确：把 X7&#x2F;Simulink 里的速度环和电流环思路，落到 AXDR-L 功率板、STM32G474、DJI M2006 减速无刷电机和 MT6816 磁编码器组成的实机平台上。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/articles/axdr-x7-speedloop-pid-current-loop/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E8%AF%BE%E7%A8%8B%E8%AE%BE%E8%AE%A1/">课程设计</a></object></span><span class="tags"><object><a href="/tags/FOC/">FOC</a></object><object><a href="/tags/STM32G474/">STM32G474</a></object><object><a href="/tags/%E7%94%B5%E6%9C%BA%E6%8E%A7%E5%88%B6/">电机控制</a></object><object><a href="/tags/Simulink/">Simulink</a></object></span><time datetime="2026-09-15T05:00:00.000Z">2026-09-15</time></div><h1 class="recent-title">基于 STM32G4 平台的无刷驱动 FOC 电流环与速度环闭环控制</h1><div class="recent-excerpt"><hr><blockquote>
<p>本文记录一次从 X7&#x2F;Simulink 速度环仿真迁移到 AXDR-L &#x2F; AxDrive-L 实物平台的完整过程。重点不是“电机能转”，而是说明一个课程设计里的仿真文件，如何一步步被拆成参数脚本、控制器验证模型、可编译 C 工程、20 kHz 电流环、1 kHz 速度环、编码器电角度闭环、SVPWM 输出、保护状态机、VOFA 遥测和自动化验证脚本。</p>
</blockquote></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/projects/ai8051u-brushless-esc-zf/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/OSHWHub/">OSHWHub</a></object><object><a href="/tags/%E6%97%A0%E5%88%B7%E7%94%B5%E8%B0%83/">无刷电调</a></object><object><a href="/tags/STC8051U/">STC8051U</a></object><object><a href="/tags/BLDC/">BLDC</a></object></span><time datetime="2026-08-16T12:30:00.000Z">2026-08-16</time></div><h1 class="recent-title">STC8051U 学习型无刷电调</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/project_tmgekiuu">OSHWHub 开源工程</a><br>本项目定位为开源学习型无刷电机驱动平台，并非工业级量产电调。</p>
</blockquote>
<h2 id="项目简介"><a href="#项目简介" class="headerlink" title="项目简介"></a>项目简介</h2><p>这是一个面向 BLDC 无刷电机驱动学习的开源电调案例板。当前硬件支持 3-6S 动力电池，使用逐飞开源的 8051 电调固件，经测试可以稳定工作在 30A+ 电流区间。</p></div><span class="read-more">阅读文章 +</span></object></a></div><div class="bottom-btn"><div><a class="i-top" id="to-top" onClick="scrolls.scrolltop();" title="回到顶部" style="opacity: 0; display: none;">∧ </a><a class="i-color" id="color-mode" onClick="colorMode.change()" title="切换主题"></a></div></div></article><aside><div id="about"><a href="/" id="logo"><img src="https://ak.hypergryph.com/assets/index/images/ak/pc/faction/1.png" alt="Logo"></a><h1 id="Dr"><a href="/">Direject</a></h1><div id="description"><p>个人作品集：嵌入式固件、硬件电路、视觉工具链与工程笔记。</p></div><div id="social-links"><a class="social" target="_blank" rel="noopener" href="https://oshwhub.com/pessenger?tab=works&amp;jspm=hub.ss.zp&amp;jlc_vid=RVdaAlNeQlNbAQdfRgdbBlBTTgBWVQBSRFZbV1UFEwMxVlNeTlVWUVZRQFZXVTsOAxUeFF5JWA8aF0oLBA9ABApJKA0NAgAHWQIA"><i class="fa fa-microchip" alt="立创开源"></i></a><a class="social" href="mailto:3505337350@qq.com"><i class="fa fa-envelope" alt="E-Mail"></i></a><a class="social" target="_blank" rel="noopener" href="https://space.bilibili.com/3546391322298955?spm_id_from=333.1007.0.0"><i class="fa-brands fa-bilibili" alt="BiliBili"></i></a></div></div><div id="aside-block"><section id="total"><a id="total-archives" href="/archives"><span class="total-title">Articles Total:</span><span class="total-number">11</span></a><div id="total-tags"><span class="total-title">Tags:</span><span class="total-number">29</span></div><div id="total-categories"><span class="total-title">Categories:</span><span class="total-number">4</span></div></section></div><footer><nobr>构建自 <a target="_blank" rel="noopener" href="http://hexo.io">Hexo</a></nobr></footer></aside></main><canvas id="canvas-dust"></canvas></body></html>

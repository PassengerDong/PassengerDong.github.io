<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
  <title id="title">Signal interface protection</title>
  <desc id="desc">A simplified three-pin connector with Schottky diode, series resistor and pulldown resistor for ESC signal input protection.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/></filter>
    <style>.bg{fill:#f8fafc}.paper{fill:#fff}.conn{fill:#fff;stroke:#c00000;stroke-width:3}.wire{stroke:#15803d;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.pin{stroke:#111827;stroke-width:3}.diode{fill:none;stroke:#c00000;stroke-width:4}.res{fill:#fff;stroke:#c00000;stroke-width:3}.label{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}.blue{fill:#1d4ed8}.red{fill:#dc2626}.small{font-size:20px}.mid{font-size:27px}.big{font-size:34px;font-weight:700}.muted{fill:#475569}.node{fill:#c00000}.gnd{stroke:#111827;stroke-width:3;fill:none}</style>
  </defs>
  <rect class="bg" width="860" height="560" rx="28"/>
  <rect x="34" y="34" width="792" height="492" rx="24" class="paper" filter="url(#shadow)"/>
  <text x="430" y="78" text-anchor="middle" class="label big">外部控制接口保护</text>
  <text x="430" y="112" text-anchor="middle" class="label mid muted">三线接口通过隔离二极管、串联电阻和下拉电阻降低倒灌、振铃与悬空误触发风险</text>
  <g transform="translate(118 170)">
    <text x="10" y="-20" class="label mid blue">H1</text>
    <text x="-28" y="100" class="label mid blue" transform="rotate(-90 -28 100)">HX-PZ2.54-1x3P</text>
    <rect x="0" y="0" width="86" height="176" class="conn"/>
    <line x1="30" y1="38" x2="84" y2="38" class="pin"/><line x1="30" y1="88" x2="84" y2="88" class="pin"/><line x1="30" y1="138" x2="84" y2="138" class="pin"/>
    <text x="36" y="46" class="label small">3</text><text x="36" y="96" class="label small">2</text><text x="36" y="146" class="label small">1</text>
    <line x1="86" y1="38" x2="238" y2="38" class="wire"/><text x="238" y="30" class="label mid blue">GND</text>
    <line x1="86" y1="88" x2="270" y2="88" class="wire"/>
    <path d="M270 70 h58 l-29 45 z" class="diode"/><line x1="328" y1="70" x2="328" y2="115" class="diode"/><line x1="328" y1="88" x2="510" y2="88" class="wire"/><text x="526" y="96" class="label mid blue">VCC</text>
    <text x="286" y="56" class="label mid blue">D1</text><text x="270" y="146" class="label mid blue">B5819WS</text>
    <line x1="86" y1="138" x2="180" y2="138" class="wire"/><rect x="180" y="119" width="108" height="38" class="res"/><text x="204" y="190" class="label mid blue">R20</text><text x="188" y="218" class="label small blue">100Ω</text><line x1="288" y1="138" x2="510" y2="138" class="wire"/><circle cx="390" cy="138" r="8" class="node"/><text x="526" y="146" class="label mid blue">SIG_IN</text>
    <rect x="368" y="160" width="44" height="112" class="res"/><text x="424" y="204" class="label mid blue">R21</text><text x="424" y="236" class="label mid blue">10kΩ</text><line x1="390" y1="138" x2="390" y2="160" class="wire"/><line x1="390" y1="272" x2="390" y2="320" class="wire"/>
    <g transform="translate(390 320)"><line x1="0" y1="0" x2="0" y2="30" class="gnd"/><line x1="-44" y1="30" x2="44" y2="30" class="gnd"/><line x1="-28" y1="45" x2="28" y2="45" class="gnd"/><line x1="-12" y1="60" x2="12" y2="60" class="gnd"/></g><text x="258" y="350" class="label mid blue" transform="rotate(-90 258 350)">GND</text>
  </g>
</svg>

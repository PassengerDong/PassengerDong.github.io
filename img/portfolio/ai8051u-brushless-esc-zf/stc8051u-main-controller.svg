<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">STC8051U controller schematic signal map</title>
  <desc id="desc">A simplified STC8051U schematic showing power, PWM bridge outputs, BEMF inputs, throttle input and debug signals.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}.chip{fill:#ffffff;stroke:#c00000;stroke-width:2}.pin{stroke:#c00000;stroke-width:2}.net{stroke:#15803d;stroke-width:3;fill:none}.netb{stroke:#2563eb;stroke-width:3;fill:none}.power{stroke:#dc2626;stroke-width:3;fill:none}.gnd{stroke:#111827;stroke-width:3;fill:none}.label{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}.blue{fill:#1d4ed8}.green{fill:#15803d}.red{fill:#dc2626}.small{font-size:20px}.mid{font-size:25px}.big{font-size:36px;font-weight:700}.muted{fill:#475569}.box{fill:#fff;stroke:#d7dee8;stroke-width:2}.cap{fill:none;stroke:#dc2626;stroke-width:3}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680" rx="28"/>
  <rect x="36" y="34" width="1128" height="612" rx="26" fill="#fff" filter="url(#shadow)"/>
  <text x="600" y="82" text-anchor="middle" class="label big">STC8051U 主控与电调信号连接</text>

  <g transform="translate(292 122)">
    <rect x="0" y="0" width="616" height="430" rx="4" class="chip"/>
    <text x="308" y="214" text-anchor="middle" class="label big">STC8051U</text>
    <text x="308" y="254" text-anchor="middle" class="label mid muted">PWM / Comparator / ADC / UART</text>
    <g class="label small">
      <text x="22" y="42">QSPIO3_2 / PWM8_4 / P5.3</text>
      <text x="22" y="78">I2SCLK / QSPI / P1.6</text>
      <text x="22" y="114">PWM / RXD / P4.7</text>
      <text x="22" y="150">TXD / P3.1</text>
      <text x="22" y="186">PWM / ADC / P3.4</text>
      <text x="22" y="222">PWMFLT / T0CLK / P3.5</text>
      <text x="22" y="258">XTALO / ADC_Vref-</text>
      <text x="22" y="294">ADC / CMP / I2SWS</text>
      <text x="22" y="330">CCP / PWM / AIN</text>
      <text x="22" y="366">SDA / ECI / PWM</text>
      <text x="22" y="402">P5.0 / RXD3 / PWM</text>

      <text x="594" y="42" text-anchor="end">QSPIO2 / PWM7 / P5.2</text>
      <text x="594" y="78" text-anchor="end">I2SWS / PWM3 / P1.4</text>
      <text x="594" y="114" text-anchor="end">PWM2 / RxD2 / ADC</text>
      <text x="594" y="150" text-anchor="end">PWM1 / PT2 / ADC0</text>
      <text x="594" y="186" text-anchor="end">PWM1P / DAC / P0.3</text>
      <text x="594" y="222" text-anchor="end">PWM2P / AIN / P0.2</text>
      <text x="594" y="258" text-anchor="end">PWM3P / AIN / P0.5</text>
      <text x="594" y="294" text-anchor="end">CMP+ / PWMFLT / P4.6</text>
      <text x="594" y="330" text-anchor="end">CMP- / PWM / P2.0</text>
      <text x="594" y="366" text-anchor="end">ALE / CMPO / P4.5</text>
      <text x="594" y="402" text-anchor="end">TXD3 / PWM / P5.1</text>
    </g>
    <g>
      <line x1="-24" y1="34" x2="0" y2="34" class="pin"/><line x1="-24" y1="106" x2="0" y2="106" class="pin"/><line x1="-24" y1="142" x2="0" y2="142" class="pin"/><line x1="-24" y1="214" x2="0" y2="214" class="pin"/><line x1="-24" y1="250" x2="0" y2="250" class="pin"/><line x1="-24" y1="322" x2="0" y2="322" class="pin"/><line x1="-24" y1="358" x2="0" y2="358" class="pin"/><line x1="616" y1="142" x2="640" y2="142" class="pin"/><line x1="616" y1="178" x2="640" y2="178" class="pin"/><line x1="616" y1="214" x2="640" y2="214" class="pin"/><line x1="616" y1="250" x2="640" y2="250" class="pin"/><line x1="616" y1="286" x2="640" y2="286" class="pin"/><line x1="616" y1="322" x2="640" y2="322" class="pin"/><line x1="616" y1="358" x2="640" y2="358" class="pin"/><line x1="616" y1="394" x2="640" y2="394" class="pin"/>
    </g>
  </g>

  <g class="label mid">
    <text x="120" y="160" class="blue">BATADC</text><line x1="214" y1="154" x2="268" y2="154" class="netb"/>
    <text x="150" y="232" class="blue">RXD</text><line x1="214" y1="226" x2="268" y2="226" class="netb"/>
    <text x="150" y="268" class="blue">TXD</text><line x1="214" y1="262" x2="268" y2="262" class="netb"/>
    <text x="138" y="340" class="green">RUN</text><line x1="214" y1="334" x2="268" y2="334" class="net"/>
    <text x="142" y="376" class="green">ERR</text><line x1="214" y1="370" x2="268" y2="370" class="net"/>
    <text x="137" y="448" class="blue">SIG_IN</text><line x1="228" y1="442" x2="268" y2="442" class="netb"/>
    <text x="142" y="484" class="blue">EMFB</text><line x1="214" y1="478" x2="268" y2="478" class="netb"/>

    <text x="984" y="268" class="green">H1</text><line x1="932" y1="262" x2="974" y2="262" class="net"/>
    <text x="984" y="304" class="green">L1</text><line x1="932" y1="298" x2="974" y2="298" class="net"/>
    <text x="984" y="340" class="green">H2</text><line x1="932" y1="334" x2="974" y2="334" class="net"/>
    <text x="984" y="376" class="green">L2</text><line x1="932" y1="370" x2="974" y2="370" class="net"/>
    <text x="984" y="412" class="green">H3</text><line x1="932" y1="406" x2="974" y2="406" class="net"/>
    <text x="984" y="448" class="green">L3</text><line x1="932" y1="442" x2="974" y2="442" class="net"/>
    <text x="984" y="484" class="blue">EMFA</text><line x1="932" y1="478" x2="974" y2="478" class="netb"/>
    <text x="984" y="520" class="blue">COMPO</text><line x1="932" y1="514" x2="974" y2="514" class="netb"/>
    <text x="984" y="556" class="blue">MID</text><line x1="932" y1="550" x2="974" y2="550" class="netb"/>
    <text x="984" y="592" class="blue">EMFC</text><line x1="932" y1="586" x2="974" y2="586" class="netb"/>
  </g>

  <g transform="translate(950 122)">
    <text x="42" y="22" class="label mid red">VCC</text>
    <line x1="84" y1="17" x2="122" y2="17" class="power"/>
    <line x1="122" y1="17" x2="122" y2="86" class="power"/>
    <line x1="98" y1="86" x2="146" y2="86" class="cap"/>
    <line x1="98" y1="112" x2="146" y2="112" class="cap"/>
    <line x1="122" y1="112" x2="122" y2="150" class="gnd"/>
    <line x1="102" y1="150" x2="142" y2="150" class="gnd"/>
    <line x1="110" y1="162" x2="134" y2="162" class="gnd"/>
    <line x1="116" y1="174" x2="128" y2="174" class="gnd"/>
    <text x="154" y="106" class="label small">C1 100nF</text>
    <text x="94" y="205" class="label mid blue">GND</text>
  </g>
</svg>

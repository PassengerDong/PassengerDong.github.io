<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Three-phase MOS inverter bridge</title>
  <desc id="desc">A simplified three-phase MOS inverter bridge using six TPH1R403NL MOSFETs, DCBUS and VS1 to VS3 phase nodes.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/></filter>
    <style>
      .bg{fill:#f8fafc}.paper{fill:#fff}.bus{stroke:#15803d;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.gate{stroke:#2563eb;stroke-width:3;fill:none}.mos{fill:#fff;stroke:#c00000;stroke-width:3}.label{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}.blue{fill:#1d4ed8}.red{fill:#dc2626}.small{font-size:18px}.mid{font-size:25px}.big{font-size:34px;font-weight:700}.muted{fill:#475569}.node{fill:#c00000}.gnd{stroke:#111827;stroke-width:3;fill:none}.res{fill:#fff;stroke:#dc2626;stroke-width:3}.diode{fill:none;stroke:#c00000;stroke-width:3}
    </style>
  </defs>
  <rect class="bg" width="1180" height="650" rx="28"/>
  <rect x="34" y="34" width="1112" height="582" rx="24" class="paper" filter="url(#shadow)"/>
  <text x="590" y="78" text-anchor="middle" class="label big">三相 MOS 逆变桥</text>
  <text x="590" y="112" text-anchor="middle" class="label mid muted">六个 TPH1R403NL 组成三个半桥，将 DCBUS 按换相策略输出到 VS1 / VS2 / VS3</text>
  <line x1="170" y1="160" x2="1010" y2="160" class="bus"/>
  <line x1="170" y1="522" x2="1010" y2="522" class="bus"/>
  <text x="560" y="150" text-anchor="middle" class="label mid blue">DCBUS</text>
  <circle cx="560" cy="160" r="8" class="node"/><circle cx="880" cy="160" r="8" class="node"/>
  <g transform="translate(220 160)">
    <g transform="translate(0 0)">
      <line x1="0" y1="0" x2="0" y2="120" class="bus"/><rect x="-34" y="72" width="68" height="70" class="mos"/><path d="M-16 98 h32 m-32 20 h32" class="diode"/><text x="78" y="88" class="label mid blue">Q1</text><text x="78" y="120" class="label small blue">TPH1R403NL</text><line x1="-110" y1="104" x2="-34" y2="104" class="gate"/><text x="-154" y="112" class="label mid blue">GH3</text>
      <circle cx="0" cy="162" r="8" class="node"/><line x1="0" y1="142" x2="0" y2="250" class="bus"/><text x="-118" y="180" class="label mid blue">VS3</text><line x1="-70" y1="174" x2="0" y2="174" class="bus"/>
      <rect x="-34" y="250" width="68" height="70" class="mos"/><path d="M-16 276 h32 m-32 20 h32" class="diode"/><text x="78" y="268" class="label mid blue">Q2</text><text x="78" y="300" class="label small blue">TPH1R403NL</text><line x1="0" y1="320" x2="0" y2="362" class="bus"/><line x1="-110" y1="284" x2="-34" y2="284" class="gate"/><text x="-154" y="292" class="label mid blue">GL3</text>
      <rect x="-105" y="308" width="44" height="90" class="res"/><text x="-83" y="422" text-anchor="middle" class="label small blue">R79 10k</text><line x1="-83" y1="284" x2="-83" y2="308" class="bus"/><line x1="-83" y1="398" x2="-83" y2="362" class="bus"/>
    </g>
    <g transform="translate(320 0)">
      <line x1="0" y1="0" x2="0" y2="120" class="bus"/><rect x="-34" y="72" width="68" height="70" class="mos"/><path d="M-16 98 h32 m-32 20 h32" class="diode"/><text x="78" y="88" class="label mid blue">Q3</text><text x="78" y="120" class="label small blue">TPH1R403NL</text><line x1="-110" y1="104" x2="-34" y2="104" class="gate"/><text x="-154" y="112" class="label mid blue">GH2</text>
      <circle cx="0" cy="162" r="8" class="node"/><line x1="0" y1="142" x2="0" y2="250" class="bus"/><text x="-118" y="180" class="label mid blue">VS2</text><line x1="-70" y1="174" x2="0" y2="174" class="bus"/>
      <rect x="-34" y="250" width="68" height="70" class="mos"/><path d="M-16 276 h32 m-32 20 h32" class="diode"/><text x="78" y="268" class="label mid blue">Q4</text><text x="78" y="300" class="label small blue">TPH1R403NL</text><line x1="0" y1="320" x2="0" y2="362" class="bus"/><line x1="-110" y1="284" x2="-34" y2="284" class="gate"/><text x="-154" y="292" class="label mid blue">GL2</text>
      <rect x="-105" y="308" width="44" height="90" class="res"/><text x="-83" y="422" text-anchor="middle" class="label small blue">R80 10k</text><line x1="-83" y1="284" x2="-83" y2="308" class="bus"/><line x1="-83" y1="398" x2="-83" y2="362" class="bus"/>
    </g>
    <g transform="translate(640 0)">
      <line x1="0" y1="0" x2="0" y2="120" class="bus"/><rect x="-34" y="72" width="68" height="70" class="mos"/><path d="M-16 98 h32 m-32 20 h32" class="diode"/><text x="78" y="88" class="label mid blue">Q5</text><text x="78" y="120" class="label small blue">TPH1R403NL</text><line x1="-110" y1="104" x2="-34" y2="104" class="gate"/><text x="-154" y="112" class="label mid blue">GH1</text>
      <circle cx="0" cy="162" r="8" class="node"/><line x1="0" y1="142" x2="0" y2="250" class="bus"/><text x="-118" y="180" class="label mid blue">VS1</text><line x1="-70" y1="174" x2="0" y2="174" class="bus"/>
      <rect x="-34" y="250" width="68" height="70" class="mos"/><path d="M-16 276 h32 m-32 20 h32" class="diode"/><text x="78" y="268" class="label mid blue">Q6</text><text x="78" y="300" class="label small blue">TPH1R403NL</text><line x1="0" y1="320" x2="0" y2="362" class="bus"/><line x1="-110" y1="284" x2="-34" y2="284" class="gate"/><text x="-154" y="292" class="label mid blue">GL1</text>
      <rect x="-105" y="308" width="44" height="90" class="res"/><text x="-83" y="422" text-anchor="middle" class="label small blue">R81 10k</text><line x1="-83" y1="284" x2="-83" y2="308" class="bus"/><line x1="-83" y1="398" x2="-83" y2="362" class="bus"/>
    </g>
  </g>
  <g transform="translate(560 522)"><line x1="0" y1="0" x2="0" y2="34" class="gnd"/><line x1="-34" y1="34" x2="34" y2="34" class="gnd"/><line x1="-22" y1="48" x2="22" y2="48" class="gnd"/><line x1="-10" y1="62" x2="10" y2="62" class="gnd"/></g>
</svg>

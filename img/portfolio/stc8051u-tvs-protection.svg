<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
  <title id="title">DCBUS TVS protection</title>
  <desc id="desc">A TVS diode SMBJ26CA connected between DCBUS and GND for input transient suppression.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/></filter>
    <style>.bg{fill:#f8fafc}.paper{fill:#fff}.wire{stroke:#15803d;stroke-width:5;fill:none;stroke-linecap:round}.diode{fill:none;stroke:#c00000;stroke-width:4}.label{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}.blue{fill:#1d4ed8}.red{fill:#dc2626}.mid{font-size:28px}.big{font-size:34px;font-weight:700}.gnd{stroke:#111827;stroke-width:4;fill:none}</style>
  </defs>
  <rect class="bg" width="520" height="620" rx="28"/>
  <rect x="40" y="34" width="440" height="552" rx="24" class="paper" filter="url(#shadow)"/>
  <text x="260" y="78" text-anchor="middle" class="label big">DCBUS 输入 TVS</text>
  <line x1="116" y1="140" x2="404" y2="140" class="wire"/>
  <text x="210" y="126" class="label mid blue">DCBUS</text>
  <line x1="260" y1="140" x2="260" y2="250" class="wire"/>
  <path d="M226 250 h68 l-34 52 z M226 354 h68 l-34 -52 z" class="diode"/>
  <line x1="226" y1="302" x2="294" y2="302" class="diode"/>
  <line x1="260" y1="354" x2="260" y2="458" class="wire"/>
  <g transform="translate(260 458)"><line x1="0" y1="0" x2="0" y2="35" class="gnd"/><line x1="-50" y1="35" x2="50" y2="35" class="gnd"/><line x1="-32" y1="52" x2="32" y2="52" class="gnd"/><line x1="-14" y1="69" x2="14" y2="69" class="gnd"/></g>
  <text x="330" y="286" class="label mid red">D3</text>
  <text x="330" y="326" class="label mid blue">SMBJ26CA</text>
  <text x="290" y="555" class="label mid blue">GND</text>
</svg>

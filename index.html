</head><body><div class="loading" style="opacity: 0;"><div class="loadingBar left"></div><div class="loadingBar right"></div></div><main><header class="closed"><div class="navBtn"><i class="navBtnIcon"><span class="navBtnIconBar"></span><span class="navBtnIconBar"></span><span class="navBtnIconBar"></span></i></div><nav><div class="navItem" id="search-header"><span class="navItemTitle"><input autocomplete="off" autocorrect="off" autocapitalize="none" placeholder="数据检索" spellcheck="false" maxlength="50" type="text" id="search-input"></span></div><div class="navItem" id="search-holder"></div><div class="search-popup" tabindex="0"><div id="search-result"></div></div><ol class="navContent"><li class="navItem"><a class="navBlock" href="/"><span class="navItemTitle">Home</span></a></li><li class="navItem" matchdata="categories,tags"><a class="navBlock" href="/archives/"><span class="navItemTitle">Archives</span></a></li></ol></nav></header><article><div class="posts"><a class="recent-post" href="/projects/q-car-unicycle-board/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/%E6%99%BA%E8%83%BD%E8%BD%A6/">智能车</a></object><object><a href="/tags/OSHWHub/">OSHWHub</a></object><object><a href="/tags/TC377/">TC377</a></object><object><a href="/tags/%E7%8B%AC%E8%BD%AE%E8%BD%A6/">独轮车</a></object><object><a href="/tags/BGA292/">BGA292</a></object><object><a href="/tags/MT9V034/">MT9V034</a></object><object><a href="/tags/%E6%9C%89%E5%88%B7%E9%A9%B1%E5%8A%A8/">有刷驱动</a></object></span><time datetime="2026-09-15T12:05:00.000Z">2026-09-15</time></div><h1 class="recent-title">Q 车模独轮主板</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/qche-mo-du-lun-zhu-ban">OSHWHub 开源工程</a><br>项目定位：基于 TC377 + Q 车模的独轮车控制主板，单路有刷驱动方案，也是一次智能车竞赛备赛遗产整理。</p>
</blockquote>
<h2 id="项目简介"><a href="#项目简介" class="headerlink" title="项目简介"></a>项目简介</h2><p>这是面向全国大学生智能车竞赛独轮组 &#x2F; 独轮信标组准备的一块开源控制主板。项目围绕 TC377 主控、核心供电、PMOS 电源开关、板载有刷驱动、双 MT9V034 摄像头、IMU、编码器、人机交互和调试接口展开。</p>
<p>这块板的目标不是做一个通用商业控制器，而是把备赛过程中踩过的硬件坑、接口规划和焊接调试经验沉淀下来，给后续参赛者提供一个能继续复刻、改板和优化的参考起点。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/articles/axdr-x7-speedloop-pid-current-loop/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E8%AF%BE%E7%A8%8B%E8%AE%BE%E8%AE%A1/">课程设计</a></object></span><span class="tags"><object><a href="/tags/AXDR/">AXDR</a></object><object><a href="/tags/X7/">X7</a></object><object><a href="/tags/FOC/">FOC</a></object><object><a href="/tags/PID/">PID</a></object><object><a href="/tags/STM32G474/">STM32G474</a></object><object><a href="/tags/M2006/">M2006</a></object><object><a href="/tags/MT6816/">MT6816</a></object><object><a href="/tags/Simulink/">Simulink</a></object><object><a href="/tags/%E7%94%B5%E6%9C%BA%E6%8E%A7%E5%88%B6/">电机控制</a></object></span><time datetime="2026-09-15T05:00:00.000Z">2026-09-15</time></div><h1 class="recent-title">AXDR X7 速度环 FOC 移植与 300 rpm 调参复盘</h1><div class="recent-excerpt"><hr><blockquote>
<p>本文记录一次从 X7&#x2F;Simulink 速度环思路迁移到 AXDR &#x2F; AxDrive-L 实物平台的完整过程。重点不是“电机能转”，而是把速度环、Id&#x2F;Iq 电流环、编码器电角度、SVPWM、保护、VOFA 遥测和自动化验证串成一个能反复调参的闭环框架。</p>
</blockquote></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/projects/smartcar-integrated-board/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/%E6%99%BA%E8%83%BD%E8%BD%A6/">智能车</a></object><object><a href="/tags/%E7%AB%9E%E8%B5%9B%E7%A1%AC%E4%BB%B6/">竞赛硬件</a></object><object><a href="/tags/%E5%BC%80%E5%8F%91%E6%9D%BF/">开发板</a></object><object><a href="/tags/TC264/">TC264</a></object><object><a href="/tags/DRV8701/">DRV8701</a></object><object><a href="/tags/%E6%97%A0%E5%88%B7%E7%94%B5%E8%B0%83/">无刷电调</a></object><object><a href="/tags/OSHWHub/">OSHWHub</a></object></span><time datetime="2026-08-31T12:25:00.000Z">2026-08-31</time></div><h1 class="recent-title">21 届智能车疯狂电路组全集成开发板</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/project_swqmmuvk">OSHWHub 开源工程</a><br>项目定位：面向第 21 届智能车竞赛疯狂电路组的轻量化全集成开发板，仅供学习与开源交流使用。</p>
</blockquote>
<h2 id="项目简介"><a href="#项目简介" class="headerlink" title="项目简介"></a>项目简介</h2><p>这是面向全国大学生智能车竞赛疯狂电路组设计的全集成开发板。项目目标是在一块小尺寸、轻量化 PCB 上集成供电、主控、有刷驱动、无刷电调、摄像头 &#x2F; 光电、编码器、IMU、WiFi SPI 和交互板接口，减少外接模块和线束。</p>
<p>原工程说明中记录，1.0mm 板厚版本整板重量约 12g 上下。项目包含适配逐飞车模和龙邱车模的两个版本，原理设计基本一致，主要差异在外形和安装方式。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/projects/ai8051u-brushless-esc-zf/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/%E6%97%A0%E5%88%B7%E7%94%B5%E8%B0%83/">无刷电调</a></object><object><a href="/tags/OSHWHub/">OSHWHub</a></object><object><a href="/tags/%E9%80%90%E9%A3%9E%E5%9B%BA%E4%BB%B6/">逐飞固件</a></object><object><a href="/tags/STC8051U/">STC8051U</a></object><object><a href="/tags/BLDC/">BLDC</a></object></span><time datetime="2026-08-16T12:30:00.000Z">2026-08-16</time></div><h1 class="recent-title">STC8051U 学习型无刷电调</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/project_tmgekiuu">OSHWHub 开源工程</a><br>本项目定位为开源学习型无刷电机驱动平台，并非工业级量产电调。</p>
</blockquote>
<h2 id="项目简介"><a href="#项目简介" class="headerlink" title="项目简介"></a>项目简介</h2><p>这是一个面向 BLDC 无刷电机驱动学习的开源电调案例板。当前硬件支持 3-6S 动力电池，使用逐飞开源的 8051 电调固件，经测试可以稳定工作在 30A+ 电流区间。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/projects/ai8051u-4in1-esc/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/%E6%99%BA%E8%83%BD%E8%BD%A6/">智能车</a></object><object><a href="/tags/OSHWHub/">OSHWHub</a></object><object><a href="/tags/%E7%94%B5%E8%B0%83/">电调</a></object><object><a href="/tags/%E5%9B%9B%E5%90%88%E4%B8%80%E7%94%B5%E8%B0%83/">四合一电调</a></object><object><a href="/tags/AI8051U/">AI8051U</a></object><object><a href="/tags/AM32/">AM32</a></object><object><a href="/tags/FD6288Q/">FD6288Q</a></object></span><time datetime="2026-08-01T12:20:00.000Z">2026-08-01</time></div><h1 class="recent-title">基于 AI8051U 的四合一电调</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/project_wvmktmui">OSHWHub 开源工程</a><br>项目定位：基于 AI8051U 主控和 AM32 移植固件的四合一 ESC，仅供学习与开源交流使用。</p>
</blockquote>
<h2 id="项目简介"><a href="#项目简介" class="headerlink" title="项目简介"></a>项目简介</h2><p>本项目是一款基于 AI8051U 作为主控芯片、移植 AM32 固件的四合一电子调速器。开源版本已经过上机实测，运行稳定，响应速度能够满足全国大学生智能车竞赛等场景使用。</p>
<p>PCB 在手工焊接上做了一定优化，但整体仍然有难度，尤其是 QFN 和 0402 元件较多。这个项目更适合作为电调硬件设计、功率&#x2F;信号隔离、固件移植和烧录调试的综合案例。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/projects/stc-4in1-esc/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/%E6%99%BA%E8%83%BD%E8%BD%A6/">智能车</a></object><object><a href="/tags/OSHWHub/">OSHWHub</a></object><object><a href="/tags/%E7%94%B5%E8%B0%83/">电调</a></object><object><a href="/tags/STC32G/">STC32G</a></object><object><a href="/tags/%E5%9B%9B%E5%90%88%E4%B8%80%E7%94%B5%E8%B0%83/">四合一电调</a></object><object><a href="/tags/%E9%80%90%E9%A3%9E%E5%9B%BA%E4%BB%B6/">逐飞固件</a></object></span><time datetime="2026-05-15T12:15:00.000Z">2026-05-15</time></div><h1 class="recent-title">STC 四合一电调</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/project_uqwvelil">OSHWHub 开源工程</a><br>项目定位：基于逐飞 STC32G 开源电调固件的四合一 ESC 硬件，用于智能车和多电机平台的动力控制学习与验证。</p>
</blockquote>
<h2 id="项目简介"><a href="#项目简介" class="headerlink" title="项目简介"></a>项目简介</h2><p>这是一个 STC 四合一电调项目，核心目标是在一块紧凑板卡上集成四路无刷电机驱动，减少独立电调和线束数量。固件使用逐飞 STC32G 开源电调程序，硬件围绕四路功率级、驱动供电、母线电容、下载焊盘和散热路径展开。</p>
<p>工程已经完成 50A 输入电流测试，运行良好。本文先记录已经明确的硬件和测试结论，后续可以继续补充 MOS 型号、驱动芯片、原理图截图、温升照片和完整测试条件。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/projects/cyt4bb7-flight-controller/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/OSHWHub/">OSHWHub</a></object><object><a href="/tags/%E9%A3%9E%E6%8E%A7/">飞控</a></object><object><a href="/tags/CYT4BB7/">CYT4BB7</a></object><object><a href="/tags/%E9%A3%9E%E8%B7%83%E9%9B%B7%E5%8C%BA/">飞跃雷区</a></object><object><a href="/tags/30-5mm/">30.5mm</a></object><object><a href="/tags/SY8303AIC/">SY8303AIC</a></object><object><a href="/tags/STC%E5%9B%9B%E5%90%88%E4%B8%80%E7%94%B5%E8%B0%83/">STC四合一电调</a></object></span><time datetime="2026-05-07T12:10:00.000Z">2026-05-07</time></div><h1 class="recent-title">CYT4BB7 开源飞控</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/project_dpztsddn">OSHWHub 开源工程</a><br>项目定位：面向第 21 届智能车竞赛“飞跃雷区”组别的小型化高集成核心控制板。</p>
</blockquote>
<h2 id="项目简介"><a href="#项目简介" class="headerlink" title="项目简介"></a>项目简介</h2><p>本项目是一个专为第 21 届智能车竞赛“飞跃雷区”组别设计的高集成度、小型化核心控制板。针对竞赛车模空间受限、重量与重心控制敏感的问题，本设计舍弃了传统开发板“大而全”的冗余布局，对电源、接口和外围资源进行了精简。</p>
<p>板型对齐业内无人机飞控常见的 30.5mm 标准安装孔位，目标是在有限空间里提供稳定、紧凑、易于集成的飞控硬件。需要特别注意：本项目引脚分配不适配逐飞学习板，复刻时必须重新核对引脚表和接口定义。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/projects/drv8701-motor-driver/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%BC%80%E6%BA%90%E7%A1%AC%E4%BB%B6/">开源硬件</a></object></span><span class="tags"><object><a href="/tags/%E6%99%BA%E8%83%BD%E8%BD%A6/">智能车</a></object><object><a href="/tags/DRV8701/">DRV8701</a></object><object><a href="/tags/OSHWHub/">OSHWHub</a></object><object><a href="/tags/%E7%94%B5%E6%9C%BA%E9%A9%B1%E5%8A%A8/">电机驱动</a></object><object><a href="/tags/%E6%9C%89%E5%88%B7%E7%94%B5%E6%9C%BA/">有刷电机</a></object><object><a href="/tags/%E7%94%B5%E8%B5%9B/">电赛</a></object></span><time datetime="2024-05-22T12:00:00.000Z">2024-05-22</time></div><h1 class="recent-title">基于 DRV8701 的双路有刷电机驱动</h1><div class="recent-excerpt"><hr><blockquote>
<p>迁移来源：<a target="_blank" rel="noopener" href="https://oshwhub.com/pessenger/ji-yu-drv8701-de-dian-ji-qu-dong">OSHWHub 开源工程</a><br>本项目是一个基于 DRV8701 的小体积双路有刷电机驱动板，面向智能车、电赛和空间受限的中大电流驱动场景。</p>
</blockquote>

capabilities:
  - title: "开源硬件设计"
    summary: "从器件选型、原理图、PCB 到公开工程页，形成别人能复刻的硬件资料。"
    items:
      - "电机驱动、智能车主板、飞控等板卡设计"
      - "功能分区、接口定义、BOM 和调试要点整理"
      - "面向 OSHWHub / GitHub Pages 的公开展示"
  - title: "电机驱动"
    summary: "围绕有刷、无刷电机驱动器和开源、自研固件做硬件与软件的结合。"
    items:
      - "双路有刷驱动"
      - "四合一无刷驱动"
      - "无刷驱动教学案例与参数验证"
  - title: "嵌入式系统"
    summary: "把控制板、飞控和接口集成拆成可焊接、可调试、可复盘的嵌入式模块。"
    items:
      - "控制板与飞控核心板"
      - "供电、通信、传感器和人机交互接口"
      - "面向实际装配的接口与调试规划"
  - title: "工程文档"
    summary: "把开源页和博客文章变成证据链，而不是只放一张图和一个标题。"
    items:
      - "项目目标、个人职责、技术栈、结果指标"
      - "调试记录、故障限制、下一步计划"

workflow:
  - title: "收集项目源"
    description: "先把 OSHWHub 工程链接、标题、简介和开源状态迁移到站内。"
  - title: "补项目证据"
    description: "为每个项目补充 PCB 截图、实物图、测试日志、关键参数和验证结论。"
  - title: "拆解能力标签"
    description: "把每个项目对应到电机、飞控、智能车、硬件设计和固件调试能力。"
  - title: "持续迭代"
    description: "后续每补一个项目页，首页卡片和归档入口都能自动形成作品集证据链。"

contact:
  title: "把项目资料发给我，我可以继续替你填充"
  description: "建议每个项目给我：项目名、目标、你负责的部分、技术栈、2-3 个结果指标、仓库/OSHWHub/文章链接、图片或视频截图。"
  email: "setupcard@foxmail.com"
  github: "https://github.com/PassengerDong"

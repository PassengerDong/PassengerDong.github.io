<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BLDC motor structure and Y connection</title>
  <desc id="desc">A simplified brushless DC motor structure showing stator coils, rotor, position sensor and driver circuit.</desc>
  <defs>
    <linearGradient id="coil" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#cfd6df"/>
      <stop offset="1" stop-color="#676d77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.wire{fill:none;stroke:#c40000;stroke-width:4;stroke-linejoin:round}.thin{fill:none;stroke:#1f2937;stroke-width:2}.heavy{fill:none;stroke:#4b5563;stroke-width:16}.label{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}.small{font-size:22px}.mid{font-size:28px}.big{font-size:40px;font-weight:700}.red{fill:#b50000}.blue{fill:#2c558f}.gold{fill:#aa9734}.chip{fill:#111827}.coil{fill:url(#coil);stroke:#777;stroke-width:2}.pin{stroke:#111827;stroke-width:4}.diode{fill:none;stroke:#111827;stroke-width:3}.trans{fill:none;stroke:#111827;stroke-width:5}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <rect x="34" y="34" width="1132" height="652" rx="26" fill="#fff" filter="url(#shadow)"/>
  <text x="600" y="76" text-anchor="middle" class="label big">BLDC 星形（Y）连接与电子换向</text>

  <g transform="translate(84 122)">
    <rect x="0" y="0" width="250" height="430" rx="18" class="panel"/>
    <text x="125" y="52" text-anchor="middle" class="label mid">三相逆变桥</text>
    <line x1="70" y1="92" x2="70" y2="344" class="pin"/>
    <line x1="174" y1="92" x2="174" y2="344" class="pin"/>
    <line x1="42" y1="92" x2="202" y2="92" class="pin"/>
    <line x1="42" y1="344" x2="202" y2="344" class="pin"/>
    <path d="M52 142 h38 l-19 34 z M52 264 h38 l-19 34 z" class="diode"/>
    <path d="M156 142 h38 l-19 34 z M156 264 h38 l-19 34 z" class="diode"/>
    <path d="M150 173 h36 m-18 -34 v68 M150 295 h36 m-18 -34 v68" class="trans"/>
    <text x="125" y="396" text-anchor="middle" class="label small">Circuit</text>
  </g>

  <g transform="translate(410 130)">
    <circle cx="360" cy="282" r="232" fill="none" stroke="#525a63" stroke-width="24"/>
    <circle cx="360" cy="282" r="270" fill="none" stroke="#c40000" stroke-width="4"/>
    <path d="M232 282 a128 128 0 0 1 256 0 z" class="red"/>
    <path d="M488 282 a128 128 0 0 1 -256 0 z" class="blue"/>
    <line x1="232" y1="282" x2="488" y2="282" stroke="#1f2937" stroke-width="2"/>
    <text x="360" y="245" text-anchor="middle" class="label big">N</text>
    <text x="360" y="346" text-anchor="middle" class="label big">S</text>

    <g transform="translate(360 88) rotate(0)">
      <rect x="-62" y="-36" width="124" height="72" rx="3" class="coil"/>
      <path d="M-70 -42 c20 18 20 18 40 0 s20 -18 40 0 s20 18 40 0 s20 -18 40 0" class="wire"/>
    </g>
    <g transform="translate(194 380) rotate(-56)">
      <rect x="-62" y="-36" width="124" height="72" rx="3" class="coil"/>
      <path d="M-70 -42 c20 18 20 18 40 0 s20 -18 40 0 s20 18 40 0 s20 -18 40 0" class="wire"/>
    </g>
    <g transform="translate(526 380) rotate(56)">
      <rect x="-62" y="-36" width="124" height="72" rx="3" class="coil"/>
      <path d="M-70 -42 c20 18 20 18 40 0 s20 -18 40 0 s20 18 40 0 s20 -18 40 0" class="wire"/>
    </g>
    <rect x="184" y="194" width="16" height="42" transform="rotate(28 192 215)" class="gold"/>
    <rect x="520" y="194" width="16" height="42" transform="rotate(-28 528 215)" class="gold"/>
    <rect x="340" y="476" width="46" height="16" class="gold"/>

    <path d="M360 52 v-96 h220 v118" class="wire"/>
    <path d="M166 386 l-110 82 h-158 v-304" class="wire"/>
    <path d="M554 386 l135 88 v90 h-650" class="wire"/>
    <circle cx="580" cy="74" r="8" fill="#c40000" stroke="#8b0000" stroke-width="3"/>
    <circle cx="56" cy="468" r="8" fill="#c40000" stroke="#8b0000" stroke-width="3"/>
    <circle cx="689" cy="474" r="8" fill="#c40000" stroke="#8b0000" stroke-width="3"/>
  </g>

  <g class="label">
    <text x="820" y="126" class="mid">星形（Y）连接</text>
    <text x="925" y="196" class="mid">位置传感器 /</text>
    <text x="925" y="232" class="mid">Position Sensor</text>
    <line x1="908" y1="244" x2="835" y2="356" class="thin"/>
    <text x="255" y="512" class="mid">转子 Rotor</text>
    <line x1="410" y1="500" x2="612" y2="360" class="thin"/>
    <text x="252" y="624" class="mid">定子 Stator</text>
    <line x1="410" y1="610" x2="564" y2="498" class="thin"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">FD6288Q gate driver and bootstrap network</title>
  <desc id="desc">A simplified gate driver schematic showing FD6288Q input pins, high-side and low-side outputs, bootstrap diodes and capacitors.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/></filter>
    <style>
      .bg{fill:#f8fafc}.paper{fill:#fff}.chip{fill:#fff;stroke:#c00000;stroke-width:2}.wire{stroke:#15803d;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.pin{stroke:#c00000;stroke-width:2}.res{fill:#fff;stroke:#dc2626;stroke-width:3}.label{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}.blue{fill:#1d4ed8}.red{fill:#dc2626}.small{font-size:18px}.mid{font-size:24px}.big{font-size:34px;font-weight:700}.muted{fill:#475569}.diode{fill:none;stroke:#dc2626;stroke-width:3}.cap{fill:none;stroke:#dc2626;stroke-width:3}.gnd{stroke:#111827;stroke-width:3;fill:none}.node{fill:#c00000}
    </style>
  </defs>
  <rect class="bg" width="1180" height="620" rx="28"/>
  <rect x="34" y="34" width="1112" height="552" rx="24" class="paper" filter="url(#shadow)"/>
  <text x="590" y="78" text-anchor="middle" class="label big">FD6288Q 三相栅极驱动与自举网络</text>
  <text x="590" y="112" text-anchor="middle" class="label mid muted">MCU 输出 H/L 控制信号，驱动芯片输出 HO/LO 至三相 MOS，并通过 VB/VS 完成高侧自举</text>

  <g transform="translate(170 150)">
    <rect x="0" y="0" width="250" height="350" class="chip"/>
    <text x="125" y="382" text-anchor="middle" class="label mid blue">FD6288Q</text>
    <g class="label small">
      <text x="14" y="34">LIN1</text><text x="14" y="70">LIN2</text><text x="14" y="106">LIN3</text>
      <text x="14" y="150">VCC</text><text x="14" y="186">COM</text>
      <text x="14" y="274">HIN1</text><text x="14" y="310">HIN2</text><text x="14" y="346">HIN3</text>
      <text x="236" y="34" text-anchor="end">LO3</text><text x="236" y="70" text-anchor="end">LO2</text><text x="236" y="106" text-anchor="end">LO1</text>
      <text x="236" y="150" text-anchor="end">VS3</text><text x="236" y="186" text-anchor="end">HO3</text><text x="236" y="222" text-anchor="end">VB3</text>
      <text x="236" y="258" text-anchor="end">VS2</text><text x="236" y="294" text-anchor="end">HO2</text><text x="236" y="330" text-anchor="end">VB2</text>
    </g>
    <g class="pin">
      <line x1="-26" y1="28" x2="0" y2="28"/><line x1="-26" y1="64" x2="0" y2="64"/><line x1="-26" y1="100" x2="0" y2="100"/><line x1="-26" y1="144" x2="0" y2="144"/><line x1="-26" y1="180" x2="0" y2="180"/><line x1="-26" y1="268" x2="0" y2="268"/><line x1="-26" y1="304" x2="0" y2="304"/><line x1="-26" y1="340" x2="0" y2="340"/>
      <line x1="250" y1="28" x2="276" y2="28"/><line x1="250" y1="64" x2="276" y2="64"/><line x1="250" y1="100" x2="276" y2="100"/><line x1="250" y1="144" x2="276" y2="144"/><line x1="250" y1="180" x2="276" y2="180"/><line x1="250" y1="216" x2="276" y2="216"/><line x1="250" y1="252" x2="276" y2="252"/><line x1="250" y1="288" x2="276" y2="288"/><line x1="250" y1="324" x2="276" y2="324"/>
    </g>
  </g>

  <g class="label mid blue">
    <text x="78" y="184">L1</text><text x="78" y="220">L2</text><text x="78" y="256">L3</text>
    <text x="78" y="294">VGS</text>
    <text x="78" y="424">H1</text><text x="78" y="460">H2</text><text x="78" y="496">H3</text>
  </g>
  <g class="wire">
    <line x1="122" y1="178" x2="144" y2="178"/><line x1="122" y1="214" x2="144" y2="214"/><line x1="122" y1="250" x2="144" y2="250"/>
    <line x1="122" y1="288" x2="144" y2="288"/><line x1="122" y1="418" x2="144" y2="418"/><line x1="122" y1="454" x2="144" y2="454"/><line x1="122" y1="490" x2="144" y2="490"/>
    <path d="M104 288 v108 h40"/><path d="M104 396 v72"/>
  </g>
  <circle cx="104" cy="396" r="7" class="node"/><line x1="84" y1="468" x2="124" y2="468" class="gnd"/><line x1="92" y1="480" x2="116" y2="480" class="gnd"/><line x1="99" y1="492" x2="109" y2="492" class="gnd"/>

  <g transform="translate(520 170)">
    <g class="label mid blue">
      <text x="0" y="22">LO3</text><text x="0" y="58">LO2</text><text x="0" y="94">LO1</text>
      <text x="0" y="138">HO3</text><text x="0" y="174">VB3</text><text x="0" y="210">VS3</text>
      <text x="0" y="254">HO2</text><text x="0" y="290">VB2</text><text x="0" y="326">VS2</text>
    </g>
    <g class="wire">
      <line x1="56" y1="16" x2="136" y2="16"/><line x1="56" y1="52" x2="136" y2="52"/><line x1="56" y1="88" x2="136" y2="88"/>
      <line x1="56" y1="132" x2="136" y2="132"/><line x1="56" y1="168" x2="136" y2="168"/><line x1="56" y1="204" x2="136" y2="204"/>
      <line x1="56" y1="248" x2="136" y2="248"/><line x1="56" y1="284" x2="136" y2="284"/><line x1="56" y1="320" x2="136" y2="320"/>
    </g>
  </g>

  <g transform="translate(700 160)">
    <text x="-20" y="140" class="label mid blue">VGS</text>
    <path d="M38 132 h78" class="wire"/><circle cx="38" cy="132" r="7" class="node"/>
    <g transform="translate(100 40)">
      <path d="M0 0 h44 l-22 34 z" class="diode"/><line x1="44" y1="0" x2="44" y2="34" class="diode"/>
      <path d="M0 100 h44 l-22 34 z" class="diode"/><line x1="44" y1="100" x2="44" y2="134" class="diode"/>
      <path d="M0 200 h44 l-22 34 z" class="diode"/><line x1="44" y1="200" x2="44" y2="234" class="diode"/>
    </g>
    <g class="wire">
      <line x1="38" y1="132" x2="100" y2="56"/><line x1="38" y1="132" x2="100" y2="156"/><line x1="38" y1="132" x2="100" y2="256"/>
      <line x1="144" y1="56" x2="300" y2="56"/><line x1="144" y1="156" x2="300" y2="156"/><line x1="144" y1="256" x2="300" y2="256"/>
    </g>
    <text x="112" y="32" class="label small blue">1N5819WS</text><text x="112" y="132" class="label small blue">1N5819WS</text><text x="112" y="232" class="label small blue">1N5819WS</text>
    <g transform="translate(300 40)">
      <line x1="0" y1="0" x2="0" y2="36" class="cap"/><line x1="18" y1="0" x2="18" y2="36" class="cap"/><text x="9" y="58" text-anchor="middle" class="label small blue">1uF</text>
      <line x1="0" y1="100" x2="0" y2="136" class="cap"/><line x1="18" y1="100" x2="18" y2="136" class="cap"/><text x="9" y="158" text-anchor="middle" class="label small blue">1uF</text>
      <line x1="0" y1="200" x2="0" y2="236" class="cap"/><line x1="18" y1="200" x2="18" y2="236" class="cap"/><text x="9" y="258" text-anchor="middle" class="label small blue">1uF</text>
    </g>
    <g class="label mid blue">
      <text x="350" y="65">VS3</text><text x="350" y="165">VS2</text><text x="350" y="265">VS1</text>
      <text x="206" y="46">VB3</text><text x="206" y="146">VB2</text><text x="206" y="246">VB1</text>
    </g>
  </g>
</svg>
